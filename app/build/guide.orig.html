<!DOCTYPE html>
<html lang="en">
<head>
<meta name="referrer" content="strict-origin-when-cross-origin" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Jordan TV</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&family=Barlow:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #07010f; color: #e8fbff; font-family: Barlow, sans-serif; }
  button, input { font: inherit; color: inherit; }
  button { background: none; border: 0; cursor: pointer; }
  #app { display: flex; flex-direction: column; height: 100%; overflow: hidden; }
  #app-inner { display: flex; flex-direction: column; height: 100%; min-height: 0; overflow: hidden; }
  .top { position: relative; display: flex; flex: none; height: 26vh; min-height: 176px; gap: 8px; padding: 8px 8px 4px; align-items: stretch; }
  .frame { width: 32%; flex: none; min-width: 180px; height: 100%; border: 3px solid #3df0ff; background: #000; position: relative; box-shadow: 0 0 10px #3df0ff, 0 0 16px #ff2bd6, inset 0 0 16px rgba(61,240,255,.28); }
  .info { position: relative; flex: 1; min-width: 0; display: block; padding: 12px 14px 10px; background: #07010f; border: 2px solid #3df0ff; box-shadow: 0 0 12px #3df0ff, inset 0 0 14px rgba(255,43,214,.28); overflow: hidden; }
  .info-top { display: block; min-width: 0; padding-right: 130px; }
  .chline { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: "Barlow Condensed", sans-serif; font-size: 20px; letter-spacing: 0.04em; text-transform: uppercase; color: #3df0ff; text-shadow: 0 0 8px #3df0ff; }
  .info .clock { position: absolute; top: 12px; right: 14px; font-family: "Barlow Condensed", sans-serif; font-size: 22px; line-height: 1; color: #3df0ff; text-shadow: 0 0 8px #3df0ff; background: #07010f; padding-left: 10px; }
  .info .mark { height: 40px; width: auto; max-width: 132px; object-fit: contain; background: #07010f; }
  .showname { display: block; margin-top: 10px; overflow: hidden; white-space: normal; font-family: "Barlow Condensed", sans-serif; font-size: 26px; line-height: 1.1; font-weight: 700; color: #fff; text-shadow: -1px -1px 0 #ff2bd6, 1px -1px 0 #ff2bd6, -1px 1px 0 #ff2bd6, 1px 1px 0 #ff2bd6, 0 0 8px #ff2bd6; }
  .when, .next, .hint { display: block; margin-top: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .when { color: #ff2bd6; font-family: "Barlow Condensed", sans-serif; font-size: 18px; }
  .next { color: #e8fbff; font-size: 16px; }
  .hint { color: #9eb0c8; font-size: 14px; }
  .info-foot { display: block; margin-top: 8px; overflow: hidden; }
  .info-foot .hint { display: inline; }
  .info-foot .mark { float: right; }
  #stage { position: fixed; z-index: 3; overflow: hidden; background: #000; }
  body.is-full #app { visibility: hidden; }
  body.is-full #stage { left: 0; top: 0; width: 100vw; height: 100vh; z-index: 40; }
  body.is-air #app { visibility: hidden; }
  body.is-air #stage { left: 0 !important; top: 0 !important; width: 100vw !important; height: 100vh !important; z-index: 40; }
  #stage, #stage video, video { outline: none; }
  #stage video { width: 100%; height: 100%; object-fit: cover; object-position: left center; background: #000; display: block; opacity: 0; }
  #stage video.live { opacity: 1; }
  #stage video::-webkit-media-controls, #stage video::-webkit-media-controls-enclosure, #stage video::-webkit-media-controls-panel, #stage video::-webkit-media-controls-play-button, #stage video::-webkit-media-controls-start-playback-button { display: none !important; opacity: 0; }
  #stage-cover { position: absolute; inset: 0; background: #000 center/cover no-repeat; }
  .hit.pick, button.pick, .pick { background: #ff2bd6; color: #07010f; outline: 3px solid #3df0ff; box-shadow: 0 0 16px #ff2bd6; }
  .playtag { position: absolute; left: 8px; bottom: 8px; background: rgba(0,0,0,.75); padding: 4px 8px; font-family: "Barlow Condensed", sans-serif; font-size: 18px; }
  .frame iframe, .frame img { width: 100%; height: 100%; border: 0; display: block; object-fit: cover; }
  .guide { flex: 1; min-height: 0; overflow: auto; background: #07010f; }
  .times, .row { display: flex; align-items: stretch; min-width: max-content; }
  .lane { display: flex; height: auto; min-height: 40px; position: relative; align-items: center; }
  .block { flex: 0 0 auto; overflow: hidden; }
  .times { position: sticky; top: 0; background: #07010f; z-index: 8; color: #3df0ff; text-shadow: 0 0 8px #3df0ff; }
  .times span, .cell { min-width: 0; padding: 6px 10px; border-left: 1px solid rgba(61,240,255,.28); overflow: hidden; white-space: nowrap; }
  .times span:first-child, .cell:first-child { border-left: 0; }
  .banner { min-width: 0; overflow: hidden; padding: 4px 12px; font-style: italic; border-top: 1px solid rgba(255,43,214,.45); color: #ffd6f6; white-space: nowrap; }
  .row { width: max-content; text-align: left; min-height: 68px; border-top: 1px solid rgba(61,240,255,.22); background: #100318; }
  .row.on { background: #1a0830; box-shadow: inset 4px 0 0 #ff2bd6; }
  .cell.slot.pick { background: #2a0a3a; color: #e8fbff; box-shadow: inset 0 0 0 2px #3df0ff, 0 0 10px #3df0ff; }
  .ch-id { display: flex; align-items: center; gap: 8px; width: 300px; height: 68px; flex: none; min-width: 0; overflow: hidden; position: sticky; left: 0; z-index: 2; background: #100318; white-space: normal; }
  .row.on .ch-id { background: #1a0830; }
  .times .ch-id { z-index: 9; background: #07010f; }
  .ch-logo { flex: 1; width: auto; height: 52px; max-width: 240px; object-fit: contain; object-position: left center; }
  .ch-id .id { display: flex; flex-wrap: wrap; align-items: baseline; column-gap: 8px; min-width: 0; max-width: 100%; }
  .ch-id b { flex: none; font-family: "Barlow Condensed", sans-serif; font-size: 28px; font-weight: 700; line-height: 1; color: #3df0ff; text-shadow: 0 0 6px #3df0ff; }
  .ch-id small { flex: 1; min-width: 90px; overflow: hidden; white-space: normal; font-size: 22px; font-weight: 700; line-height: 1.05; letter-spacing: 0.02em; text-transform: uppercase; color: #fff; text-shadow: -1px -1px 0 #ff2bd6, 1px -1px 0 #ff2bd6, -1px 1px 0 #ff2bd6, 1px 1px 0 #ff2bd6, 0 0 8px #ff2bd6; }
  .card .ch { display: block; overflow: hidden; font-size: 18px; line-height: 1.1; letter-spacing: 0.04em; text-transform: uppercase; color: #ff2bd6; white-space: nowrap; }
  .title { overflow: hidden; font-family: "Barlow Condensed", sans-serif; font-size: 16px; font-weight: 700; }
  .cell.title { white-space: normal; display: flex; align-items: center; line-height: 1.15; color: #3df0ff; text-shadow: 0 0 6px #3df0ff; }
  .cell.title .name { display: block; white-space: normal; line-height: 1.15; }
  .title.block { flex: 0 0 auto; }
  .roll { display: block; overflow: hidden; min-width: 0; white-space: nowrap; }
  .roll > span { display: inline-block; white-space: nowrap; }
  .roll.on > span { animation: crawl 11s linear infinite; }
  @keyframes crawl { 0%, 18% { transform: translateX(0); } 82%, 100% { transform: translateX(calc(-1 * var(--shift))); } }
  .bar { display: flex; flex: none; flex-wrap: wrap; gap: 4px; background: #07010f; padding: 4px 8px; border-top: 1px solid #3df0ff; }
  .bar.on { background: #1a0830; box-shadow: 0 0 12px #ff2bd6; }
  .bar.on button { background: #ff2bd6; color: #07010f; box-shadow: 0 0 10px #ff2bd6; }
  .bar button { min-height: 44px; padding: 0 12px; color: #3df0ff; }
  .shade { position: fixed; inset: 0; z-index: 20; background: rgba(7,1,15,.92); display: flex; align-items: center; justify-content: center; padding: 16px; }
  .sheet { width: min(520px, 100%); max-height: 86vh; overflow: auto; background: #100318; border: 2px solid #ff2bd6; box-shadow: 0 0 18px #3df0ff; padding: 16px; }
  .qr { width: 168px; height: 168px; background: #fff; padding: 8px; margin: 10px 0; }
  .qr svg { width: 100%; height: 100%; display: block; }
  .sheet h2 { margin: 0; font-family: "Barlow Condensed", sans-serif; font-size: 32px; font-weight: 500; }
  .sheet p { color: #9eb0c8; }
  .sheet input, .sheet textarea { width: 100%; margin-top: 8px; background: #05080f; border: 1px solid #1c3d5e; padding: 12px; }
  .sheet .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }
  .go { background: #f4f7fb; color: #071018; min-height: 44px; padding: 0 16px; }
  .hit { display: block; width: 100%; text-align: left; padding: 8px 0; border-top: 1px solid #1c3d5e; }
  .full { position: fixed; inset: 0; background: #000; z-index: 5; display: flex; flex-direction: column; }
  .full iframe { flex: 1; width: 100%; border: 0; }
  .err { color: #f4f7fb; }
</style>
</head>

    if (window.JordanTube && window.JordanTube.traktBegin) window.JordanTube.traktBegin();
    return;
  }
  if (id && id.indexOf("list:") === 0) {
    pendingList = id.slice(5);
    note = "Loading that list.";
    busy = true;
    draw();
    if (window.JordanTube && window.JordanTube.traktChannel) window.JordanTube.traktChannel(pendingList);
  }
}
window.onLists = (text) => {
  try { cloudLists = JSON.parse(text || "[]"); } catch (e) { cloudLists = []; }
  if (panel === "cloud") draw();
};
window.onTraktCode = (code) => {
  note = code ? "" : "Paste the Trakt client id first. There is no secret.";
  draw();
  if (code && !traktTimer) {
    traktTimer = setInterval(() => { if (window.JordanTube && window.JordanTube.traktPoll) window.JordanTube.traktPoll(); }, 5000);
  }
};
window.onTraktPoll = (status) => {
  if (status !== "ok") return;
  if (traktTimer) clearInterval(traktTimer);
  traktTimer = 0;
  note = "Trakt is linked. Pick a list.";
  if (window.JordanTube && window.JordanTube.traktLists) window.JordanTube.traktLists();
  draw();
};
window.onTraktChannel = (text) => {
  busy = false;
  let parsed = null;
  try { parsed = JSON.parse(text || "{}"); } catch (e) { parsed = null; }
  const videos = parsed && Array.isArray(parsed.videos) ? parsed.videos : [];
  if (!videos.length) { note = "That list has nothing Jordan TV can play."; panel = "cloud"; draw(); return; }
  const known = cloudLists.find((list) => list.id === pendingList);
  const name = (known && known.name) || parsed.name || "Trakt";
  const number = state.stations.reduce((max, item) => Math.max(max, item.number), 0) + 1;
  const id = "trakt-" + (pendingList || Date.now());
  const existing = state.stations.find((item) => item.id === id);
  const station = { id, number: existing ? existing.number : number, name: String(name).slice(0, 32), skipShort: false, mode: "order", logo: "", videos };
  if (existing) Object.assign(existing, station, { number: existing.number });
  else state.stations.push(station);
  state.activeId = id;
  panel = null;
  note = "";
  tuned = null;
  if (window.JordanTube && window.JordanTube.setTyping) window.JordanTube.setTyping(false);
  save();
  draw();
};
function programVideo() {
  if (!programTarget) return null;
  const station = state.stations.find((item) => item.id === programTarget.stationId);
  const video = station && station.videos.find((item) => item.id === programTarget.videoId);
  return station && video ? { station, video } : null;
}
function openProgram() {
  const station = active();
  const show = station ? programAt(station, focusSlot) : null;
  if (!station) return;
  if (!show || !show.video) { openChannel(); return; }
  programTarget = { stationId: station.id, videoId: show.video.id };
  programIndex = 0;
  panel = "program";
  draw();
}
function runProgram(id) {
  const found = programVideo();
  if (!found) { closePanel(); return; }
  if (id === "rename") {
    ask("retitle", "Show name", found.video.title);
    return;
  }
  if (id === "drop") {
    found.station.videos = found.station.videos.filter((video) => video.id !== found.video.id);
    if (tuned && tuned.videoId === found.video.id) tuned = null;
    panel = null;
    focusSlot = 0;
    save();
    draw();
    return;
  }
  if (id === "set") {
    const set = found.video.set;
    const same = set ? found.station.videos.filter((video) => video.set === set) : [];
    if (set && same.length > 1) found.station.videos = found.station.videos.filter((video) => video.set !== set);
    else found.station.videos = found.station.videos.filter((video) => video.id !== found.video.id);
    tuned = null;
    if (state.resume && state.resume.stationId === found.station.id) state.resume = null;
    panel = null;
    focusSlot = 0;
    save();
    draw();
    return;
  }
  if (id === "channel") openChannel();
}
function openChannel() {
  panel = "channel";
  channelIndex = 0;
  draw();
}
function runChannel(id) {
  const current = active();
  if (!current) return;
  if (id === "more") { addOnto = true; note = ""; openPanel("add"); return; }
  if (id === "skip") { current.skipShort = !current.skipShort; save(); draw(); return; }
  if (id === "shuffle") { current.mode = current.mode === "shuffle" ? "order" : "shuffle"; state.shuffleAt = Date.now(); tuned = null; save(); draw(); return; }
  if (id === "begin") { current.fromStart = !current.fromStart; tuned = null; save(); draw(); return; }
  if (id === "logolink") { ask("logolink", "Image link", ""); return; }
  if (id === "logofile") {
    if (window.JordanTube && window.JordanTube.pickLogo) window.JordanTube.pickLogo(current.id);
    return;
  }
  if (id === "rename") {
    panel = "rename";
    formIndex = 0;
    draw();
    ask("rename", "Channel name", current.name);
    return;
  }
  if (id === "remove") { confirmYes = false; panel = "confirm"; draw(); }
}
function markPick(selector, index) {
  const nodes = document.querySelectorAll(selector);
  nodes.forEach((node, i) => node.classList.toggle("pick", i === index));
  if (nodes[index] && nodes[index].parentElement) {
    const box = nodes[index].parentElement.getBoundingClientRect();
    const pick = nodes[index].getBoundingClientRect();
    if (pick.top < box.top) nodes[index].parentElement.scrollTop -= box.top - pick.top;
    else if (pick.bottom > box.bottom) nodes[index].parentElement.scrollTop += pick.bottom - box.bottom;
  }
}
function openMenu() {
  panel = "menu";
  menuIndex = 0;
  confirmYes = false;
  if (window.JordanTube && window.JordanTube.setTyping) window.JordanTube.setTyping(false);
  draw();
}
function runMenu(id) {
  const current = active();
  if (id === "air") {
    state.onAir = !state.onAir;
    save();
    if (!state.onAir) leaveAir();
    else bumpAir();
    draw();
    return;
  }
  if (id === "player") { openSettings(); return; }
  if (id === "archive") { openFilePlayers(); return; }
  if (id === "add") { addOnto = false; note = ""; openPanel("add"); return; }
  if (id === "find") { openPanel("find"); return; }
  if (id === "export") { exportSetup(); return; }
  if (id === "import") { importSetup(); return; }
  if (id === "cloud") { openCloud(); }
}
function removeCurrent() {
  const current = active();
  if (!current) { closePanel(); return; }
  state.stations = state.stations.filter((station) => station.id !== current.id);
  state.activeId = state.stations[0] ? state.stations[0].id : "";
  panel = null;
  save();
  draw();
}
function backOne() {
  if (panel === "rename" || panel === "confirm") {
    panel = "channel";
    if (window.JordanTube && window.JordanTube.setTyping) window.JordanTube.setTyping(false);
    draw();
    return;
  }
  if (panel === "player" || panel === "fileplay" || panel === "add" || panel === "find") {
    panel = "menu";
    if (window.JordanTube && window.JordanTube.setTyping) window.JordanTube.setTyping(false);
    draw();
    return;
  }
  closePanel();
}
function closePanel() {
  panel = null;
  if (window.JordanTube && window.JordanTube.setTyping) window.JordanTube.setTyping(false);
  draw();
  bumpAir();
}
function bumpAir() {
  clearTimeout(airTimer);
  if (!state.onAir || onAir || panel || away) return;
  airTimer = setTimeout(enterAir, 60000);
}
function airMark() {
  const station = onAir ? active() : null;
  if (!window.JordanTube || !window.JordanTube.airMark) return;
  window.JordanTube.airMark(station && station.logo ? station.logo : "", station ? station.number + "  " + station.name : "");
}
function enterAir() {
  clearTimeout(airTimer);
  if (!state.onAir || onAir || panel || away) return;
  const station = active();
  const show = station ? currentShow(station) : null;
  if (!station || !show || !show.video) return;
  onAir = true;
  draw();
}
function leaveAir() {
  if (!onAir) {
    airMark();
    return;
  }
  onAir = false;
  document.body.classList.remove("is-air");
  if (window.JordanTube && window.JordanTube.stopAmbient) window.JordanTube.stopAmbient();
  draw();
  bumpAir();
}
function playCurrent() {
  const item = active();
  const show = item ? airing(item, now) : null;
  if (!show) return;
  if (window.JordanTube && window.JordanTube.watch) window.JordanTube.watch(show.video.id, show.offset);
}
function ordered() { return state.stations.slice().sort((a, b) => a.number - b.number); }
function tune(index) {
  const list = ordered();
  if (!list.length) return;
  const next = Math.max(0, Math.min(list.length - 1, index));
  state.activeId = list[next].id;
  focusSlot = 0;
  playing = null;
  tuned = null;
  held = null;
  save();
  draw();
}
window.onRemote = (key) => {
  if (onAir) { leaveAir(); return; }
  bumpAir();
  if (away && key === "back") {
    openFull = false;
    const station = active();
    const played = window.JordanTube && window.JordanTube.played ? Number(window.JordanTube.played()) || 0 : 0;
    if (window.JordanTube && window.JordanTube.hidePlayer) window.JordanTube.hidePlayer();
    const video = document.getElementById("player");
    if (video) video.dataset.file = "";
    if (station && held && held.id && played > 1) tuned = { stationId: station.id, videoId: held.id, offset: played, hold: true };
    away = false;
    draw();
    return;
  }
  if (panel === "playmode") {
    if (key === "down" || key === "up") { modePick = modePick ? 0 : 1; draw(); return; }
    if (key === "ok") chooseMode(modePick);
    if (key === "back") { panel = null; draw(); }
    return;
  }
  if (panel === "player" || panel === "fileplay") {
    const list = panel === "fileplay" ? filePlayers : players;
    const picked = panel === "fileplay" ? "[data-fileplayer]" : "[data-player]";
    if (key === "down" || key === "up") {
      pickIndex = key === "down" ? Math.min(list.length - 1, pickIndex + 1) : Math.max(0, pickIndex - 1);
      markPick(picked, pickIndex);
      return;
    }
    if (key === "ok") {
      if (panel === "fileplay") chooseFilePlayer(list[pickIndex] && list[pickIndex].id);
      else choosePlayer(list[pickIndex] && list[pickIndex].id);
    }
    if (key === "back" || key === "left") backOne();
    return;
  }
  if (panel === "confirm") {
    if (key === "left" || key === "right" || key === "up" || key === "down") { confirmYes = !confirmYes; draw(); return; }
    if (key === "ok") { if (confirmYes) removeCurrent(); else backOne(); }
    if (key === "back") backOne();
    return;
  }
  if (panel === "program") {
    if (key === "down" || key === "up") {
      programIndex = key === "down" ? Math.min(PROGRAM.length - 1, programIndex + 1) : Math.max(0, programIndex - 1);
      markPick("[data-program]", programIndex);
      return;
    }
    if (key === "ok") runProgram(PROGRAM[programIndex]);
    if (key === "back" || key === "left") closePanel();
    return;
  }
  if (panel === "channel") {
    if (key === "down" || key === "up") {
      channelIndex = key === "down" ? Math.min(CHANNEL.length - 1, channelIndex + 1) : Math.max(0, channelIndex - 1);
      markPick("[data-channel]", channelIndex);
      return;
    }
    if (key === "ok") runChannel(CHANNEL[channelIndex]);
    if (key === "back" || key === "left") closePanel();
    return;
  }
  if (panel === "menu") {
    if (key === "down" || key === "up") {
      menuIndex = key === "down" ? Math.min(MENU.length - 1, menuIndex + 1) : Math.max(0, menuIndex - 1);
      markPick("[data-menu]", menuIndex);
      return;
    }
    if (key === "ok") runMenu(MENU[menuIndex]);
    if (key === "back" || key === "left") closePanel();
    return;
  }
  if (panel === "cloud") {
    const actions = cloudActions(cloudState());
    if (key === "down" || key === "up") {
      cloudIndex = key === "down" ? Math.min(actions.length - 1, cloudIndex + 1) : Math.max(0, cloudIndex - 1);
      markPick("[data-cloud]", cloudIndex);
      return;
    }
    if (key === "ok") runCloud(actions[cloudIndex] && actions[cloudIndex].id);
    if (key === "back" || key === "left") {
      if (traktTimer) clearInterval(traktTimer);
      traktTimer = 0;
      if (window.JordanTube && window.JordanTube.setTyping) window.JordanTube.setTyping(false);
      closePanel();
    }
    return;
  }
  if (panel === "add" || panel === "find" || panel === "rename") {
    const nodes = Array.from(document.querySelectorAll(".sheet button"));
    if (key === "down" || key === "up") {
      formIndex = key === "down" ? Math.min(Math.max(nodes.length - 1, 0), formIndex + 1) : Math.max(0, formIndex - 1);
      nodes.forEach((node, index) => node.classList.toggle("pick", index === formIndex));
      return;
    }
    if (key === "ok" && nodes[formIndex]) nodes[formIndex].click();
    if (key === "back" || key === "left") backOne();
    return;
  }
  if (panel) {
    if (key === "back") backOne();
    return;
  }
  if (key === "hold") {
    if (!panel && zone === "rows" && active()) openProgram();
    return;
  }
  if (key === "menu") {
    if (!panel && zone === "rows" && active()) openChannel();
    return;
  }
  if (key === "back" && full) { full = false; draw(); return; }
  const list = ordered();
  const index = Math.max(0, list.findIndex((item) => item.id === state.activeId));
  if (key === "down") {
    if (zone === "bar") return;
    if (index >= list.length - 1) { zone = "bar"; draw(); }
    else tune(index + 1);
    return;
  }
  if (key === "up") {
    if (zone === "bar") { zone = "rows"; draw(); }
    else tune(index - 1);
    return;
  }
  if (key === "left") {
    if (zone === "bar") {
      if (state.onAir) { barPick = 0; draw(); return; }
      zone = "rows";
      draw();
      return;
    }
    focusSlot = Math.max(0, focusSlot - 1);
    draw();
    return;
  }
  if (key === "right") {
    if (zone === "bar") {
      if (state.onAir) { barPick = 1; draw(); }
      return;
    }
    const shown = active();
    const maxSlot = shown ? Math.max(0, blocks(shown).length - 1) : 0;
    focusSlot = Math.min(maxSlot, focusSlot + 1);
    draw();
    return;
  }
  if (key === "ok") {
    if (zone === "bar") {
      if (state.onAir && barPick === 1) { enterAir(); return; }
      openMenu();
      return;
    }
    handOff();
  }
  if (key === "back" && zone === "bar") { zone = "rows"; draw(); }
};
window.guideBack = () => { window.onRemote("back"); return true; };
document.addEventListener("keydown", (event) => {
  const map = { ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right", Enter: "ok", Escape: "back", Backspace: "back" };
  const key = map[event.key];
  if (!key || panel === "add" || panel === "find" || panel === "rename") return;
  event.preventDefault();
  window.onRemote(key);
});
if (window.JordanTube && window.JordanTube.player) {
  const saved = window.JordanTube.player();
  if (saved) playerId = saved;
}
if (window.JordanTube && window.JordanTube.players) {
  try {
    const parsed = JSON.parse(window.JordanTube.players() || "[]");
    if (Array.isArray(parsed) && parsed.length) players = parsed;
  } catch (e) { /* The window stays the player. */ }
}
window.nextOnPlaylist = nextOnPlaylist;
draw();
bumpAir();
</script>
